[project]
name = "reducto-bench"
version = "0.1.0"
description = "Benchmark Reducto on scanned DOJ Epstein-release email pages: ease of use, performance, accuracy, business fit."
requires-python = ">=3.10"
dependencies = [
  "reductoai",
  "httpx",
  "python-dotenv",
  "rapidfuzz>=3.14.5",
  "python-dateutil>=3.0.0",
  "pypdf>=7.1.0",
  "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
